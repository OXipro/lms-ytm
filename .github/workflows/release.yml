name: Release

# Pack Plugins/YouTubeMusic, write repo.xml with the zip SHA1, and publish both
# as GitHub release assets. LMS additional repository:
# https://github.com/OXipro/lms-ytm/releases/latest/download/repo.xml
# The zip URL inside that file is version-pinned so the SHA cannot drift.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack zip and repo.xml
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' Plugins/YouTubeMusic/install.xml | head -1)
          [ -n "$version" ]
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME does not match install.xml version $version" >&2
            exit 1
          }
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME" | head -1)
          if [ -n "$subject" ] && [ "$subject" != "v$version" ] && [ "$subject" != "$GITHUB_REF_NAME" ]; then
            export PLUGIN_CHANGES="$version: $subject"
          fi
          python3 scripts/pack-plugin.py
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes_file="$RUNNER_TEMP/release-notes.md"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            printf 'YouTube Music plugin %s\n' "$VERSION" > "$notes_file"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/lms-ytm.zip dist/repo.xml --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" dist/lms-ytm.zip dist/repo.xml \
              --latest \
              --title "YouTube Music $VERSION" \
              --notes-file "$notes_file"
          fi
